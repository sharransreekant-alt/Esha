    <script>
      (function () {
        try {
          var stored = localStorage.getItem('eshaTheme');
          var theme;
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else {
            var h = new Date().getHours();
            theme = (h >= 19 || h < 7) ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
